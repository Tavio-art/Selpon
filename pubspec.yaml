name: sari_app
description: "Sari - Sari-Sari Store Management App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.5
  firebase_database: ^11.3.0
  firebase_messaging: ^15.2.10

  # Local notifications
  flutter_local_notifications: ^22.3.1

  # UI and charts
  cupertino_icons: ^1.0.9
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1

  # Date and formatting
  intl: ^0.20.3

  # Scanner
  mobile_scanner: ^5.2.3

  # Profile image and image processing
  image_picker: ^1.1.2
  image: ^4.1.7

  # Network
  http: ^1.6.0

  # Permissions
  permission_handler: ^13.0.2

  # Local storage
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  remove_alpha_ios: true
  background_color_ios: "#0E241C"
  adaptive_icon_foreground: "assets/icon/logo_foreground.png"
  adaptive_icon_background: "#0E241C"
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icon/
    - assets/uploads/
    - assets/images/
    - assets/images/icons/
